# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: Culture
options:
  bundleIdPrefix: com.geigecoast.culture
  deploymentTarget:
    iOS: "17.0"        # Needed for SwiftData + Observation. Confirm with the team (spec §1).
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""           # Set your Apple team ID
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      CULTURE_SHOW_UNREVIEWED: "YES"
    Release:
      CULTURE_SHOW_UNREVIEWED: "NO"
configs:
  Debug: debug
  Beta: release      # Internal TestFlight: release optimisations, shows content in review
  Release: release   # App Store: published content only

packages:
  CultureKit:
    path: CultureKit

targets:
  Culture:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes: ["Info.plist", "Culture.entitlements"]
    dependencies:
      - package: CultureKit
        product: CultureCore
      - target: CultureWidgets
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Culture
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Culture utilise votre position une seule fois, à votre demande, pour proposer la ville la plus proche. Elle n'est ni conservée ni suivie en arrière-plan."
        CFBundleURLTypes:
          - CFBundleURLName: app.culture.deeplink
            CFBundleURLSchemes: [culture]
        CultureShowUnreviewedContent: $(CULTURE_SHOW_UNREVIEWED)
        CultureContentBaseURL: ""      # e.g. https://<project>.supabase.co/storage/v1/object/public/
        CultureBackendURL: ""          # e.g. https://<project>.supabase.co/
        CultureBackendAnonKey: ""      # Supabase anon key (public, protected by RLS)
    # Works with a FREE Apple ID ("Personal Team"). Sign in with Apple, App Groups (sharing data
    # with widgets), push and universal links need the paid Apple Developer Program: when you
    # have it, generate with `xcodegen --spec project-paid.yml` instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geigecoast.culture
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
      configs:
        Beta:
          CULTURE_SHOW_UNREVIEWED: "YES"
    preBuildScripts:
      - name: Validate seed content
        script: |
          if command -v node >/dev/null 2>&1; then
            node "$SRCROOT/admin/validate.mjs" --quiet || exit 1
          fi
        basedOnDependencyAnalysis: false

  CultureWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Sources/Services/WidgetSnapshot.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Culture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geigecoast.culture.widgets
        CODE_SIGN_STYLE: Automatic

  CultureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Culture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geigecoast.culture.uitests

schemes:
  Culture:
    build:
      targets:
        Culture: all
    test:
      config: Debug
      targets:
        - CultureUITests   # CultureCore tests run with `swift test` (see CI)
    archive:
      config: Beta
