name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # daily event-freshness report

jobs:
  content:
    name: Content, strings & editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate content
        run: node admin/validate.mjs
      - name: Editor tests
        run: cd admin && npm test
      - name: Bundle is up to date
        run: |
          node admin/build-bundle.mjs
          git diff --exit-code App/Resources/SeedContent/content-bundle.json
      - name: String catalog is up to date and complete
        run: |
          python3 scripts/gen_strings.py
          git diff --exit-code App/Resources/Localizable.xcstrings
      - name: Event freshness report
        run: node admin/check-events.mjs

  ios:
    name: iOS app build + domain tests
    # Intel pool: the Apple-silicon (macos-15) queue repeatedly timed out for this repo.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator (iPhone + iPad)
        run: |
          set -o pipefail
          xcodebuild build -project Culture.xcodeproj -scheme Culture \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log
      - name: Domain tests (CultureCore)
        if: always()
        run: cd CultureKit && swift test 2>&1 | tail -80
