name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # daily event-freshness report

jobs:
  content:
    name: Content, strings & editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate content
        run: node admin/validate.mjs
      - name: Editor tests
        run: cd admin && npm test
      - name: Bundle is up to date
        run: |
          node admin/build-bundle.mjs
          git diff --exit-code App/Resources/SeedContent/content-bundle.json
      - name: String catalog is up to date and complete
        run: |
          python3 scripts/gen_strings.py
          git diff --exit-code App/Resources/Localizable.xcstrings
      - name: Event freshness report
        run: node admin/check-events.mjs

  ios:
    name: iOS app build + domain tests
    # Intel pool: the Apple-silicon (macos-15) queue repeatedly timed out for this repo.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator (iPhone + iPad)
        run: |
          set -o pipefail
          xcodebuild build -project Culture.xcodeproj -scheme Culture \
            -destination 'generic/platform=iOS Simulator' \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log
      - name: Domain tests (CultureCore)
        if: always()
        run: cd CultureKit && swift test 2>&1 | tail -80

  screenshots:
    name: Launch in simulators + screenshots
    runs-on: macos-15-intel
    needs: ios
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild build -project Culture.xcodeproj -scheme Culture \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Launch and capture
        run: |
          set -x
          APP=$(find dd/Build/Products -name "Culture.app" -maxdepth 3 | head -1)
          mkdir -p shots
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20
          for DEV in "iPhone 16 Pro" "iPad Pro 13-inch (M4)"; do
            UDID=$(xcrun simctl list devices available | grep -F "$DEV (" | head -1 | grep -oE '[0-9A-F-]{36}')
            [ -z "$UDID" ] && { echo "no $DEV"; continue; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            NAME=$(echo "$DEV" | tr ' ()' '___')
            xcrun simctl launch "$UDID" com.geigecoast.culture -app-language fr; sleep 25
            xcrun simctl io "$UDID" screenshot "shots/${NAME}-onboarding.png"
            xcrun simctl terminate "$UDID" com.geigecoast.culture
            xcrun simctl launch "$UDID" com.geigecoast.culture -skip-onboarding -app-language fr; sleep 30
            xcrun simctl io "$UDID" screenshot "shots/${NAME}-home.png"
            xcrun simctl shutdown "$UDID"
          done
          ls -la shots
      - name: Small copies in the log (for reviewers without artifact access)
        run: |
          for f in shots/*.png; do
            sips -Z 700 -s format jpeg -s formatOptions 60 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "BEGIN-SHOT $(basename "${f%.png}")"; base64 -i "${f%.png}.jpg" | fold -w 4000; echo "END-SHOT"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
